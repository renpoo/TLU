meta:
  sdl_id: "SDL_009"
  title: "Telemetry, Profiling HUD and QA Compliance Specification"
  status: "PROPOSED_REVISION"
  target_issue: "A17"
  revision_date: "2026-08-11"

qa_compliance:
  1_physical_tdd:
    rule: "コード変更前に『物理契約（例: 質量保存残差 == 0.00, テンソル正定値性）』をテストコードとして記述する。"
  2_regression_testing:
    command: "bash bin/batch_unittest.sh"
    rule: "新機能追加時、既存の30のユニットテストおよび16のインテグレーションテスト（計46テストモジュール、または journal.jsonl の run_record.counts 参照）を無傷全パスさせる。"
  3_production_build_check:
    command: "npm run build"
    rule: "TypeScript型エラー・リンター警告ゼロでの完全ビルド成功を確認してからコミットを行う。"
