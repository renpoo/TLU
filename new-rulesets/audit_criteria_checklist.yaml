revision_meta_2026_08_09:
  status: >
    【重要】本改訂は草案である。確定するには以下の2段階を経ること。
    (1) 蓮風さん(アーキテクト)による通読。
    (2) Geminiによる査読 — 特に「反対側からの査読」を依頼する。
        Claudeが基準を書き、その基準でClaudeが監査するなら、立法と司法を兼ねることになり、
        CLAUDE_AUDIT_HANDOFF.md 第5節の二重盲検原則が空洞化する。
        Geminiには、測定不能な基準・実装コストに見合わない基準を突き返す動機があり、
        それは健全な圧力として機能する。不一致は揉み消さず、
        CLAUDE_AUDIT_HANDOFF.md 第5節に従ってログすること。
    最終判断は蓮風さんが下す。

  origin: >
    2026-08-09、Claude自身の監査レポート群に対してメタ監査を実施した
    (AUDIT_REPORT.md 付録A)。その結果、本チェックリストv1.0.0が
    カバーしていなかった5つの盲点が特定された。本改訂はその5点への対応である。

  what_the_meta_audit_validated: >
    公平を期すために記録する。メタ監査は、v1.0.0の既存14項目に
    「内容の誤り」を一件も見つけなかった。検証した10件以上のfile:line参照は
    全て正確で、A3(名前と実体)・A4(重複検出)・C2(仕様と実装)・C4(一次資料)・
    D1(意図か過失か)はいずれも実際に有効な発見を生んでいた。
    したがって本改訂は「既存項目の訂正」ではなく「カバー範囲の穴埋め」である。
    v1.0.0の項目で削除・格下げすべきものは、現時点では見つかっていない。

  the_core_diagnosis: >
    メタ監査が見つけた誤りは、全て「範囲」に関するものだった。
    コードの読解そのもの(行番号、ロジックの理解)には誤りがほぼなかった一方、
    「何件あるか」「他にも同種のものがないか」「その主張は例外なく成り立つか」
    という、個別の観察ではなく**観察の網羅性**に関わる部分に集中していた。
    v1.0.0は「問題をどう見つけるか」の基準は備えていたが、
    「見つけたものをどう正確に書くか」の基準を持っていなかった。
    この構造的な欠落に対応するため、カテゴリEを新設する。

  changes:
