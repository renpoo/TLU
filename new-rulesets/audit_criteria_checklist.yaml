meta:
  origin: >
    本チェックリストは、事前に設計されたものではなく、2026-08-07〜08に実施した
    一連の監査(本体・GUI・サンプル事例・コード構造。2026-08-09に AUDIT_REPORT.md へ
    統合済み)と、蓮風さんへのヒアリングを踏まえた改訂作業を通じて、
    実際に繰り返し適用していた観点を、事後的に言語化・一般化したものである。
    したがって各項目には、今回実際に何を発見したかという具体例が付記されている。
  purpose: >
    外部監査(Claudeによる定期監査)を待たずとも、開発の各段階(実装中、コミット前、
    機能完成時)でGemini自身、あるいは蓮風さん自身が再帰的に適用できるチェックリストとして
    運用することを意図する。全項目を毎回適用する必要はなく、後述のapplicability_tierに
    従って粒度を使い分けること。

# ------------------------------------------
# カテゴリA: 静的観点(コードを読むだけで検証可能)
# ------------------------------------------
category_A_static_reading:
  A1_formula_direct_verification:
    question: "docstring・変数名が主張する数式と、実際のコードの数式は一致しているか。"
    example: "core_information_geometry.compute_kl_divergence — docstringは'D_KLを計算'と主張するが、実際はP_baseline=0の項を0にマスクする、数学的に異なる処理を行っていた。"
    applicability_tier: "per-commit"

  A2_boundary_condition_verification:
    question: "値がゼロになる・初めて出現する・履歴が空である、といった境界条件を個別に思考実験したか。"
    example: "P_baseline=0 かつ P_current>0 という、まさに横領検知の核心となる境界ケースが、テストでも一度も検証されていなかった。"
    applicability_tier: "per-commit"

  A3_name_substance_correspondence:
    question: "変数・関数・カラム名が主張する意味と、実際の計算内容は一致しているか。"
    example: "TLU-App-4のlqrSensitivityは、名前はLQR由来の制御感度を主張するが、実体はフラックス絶対値の単純総和だった。"
    applicability_tier: "per-commit"

  A4_duplication_reinvention_detection:
    question: "同じ計算が複数箇所に独立実装されていないか。"
    example: "core_kinematics.build_echo_matrixとcore_echo_dynamics.compute_finite_echoが同じ式の重複実装。後者は死んだコードだった。"
    applicability_tier: "periodic"

  A5_architectural_principle_compliance:
    question: "プロジェクト自身が定めた層分離(orchestration/math/presentation)に違反していないか。"
    example: "_002_2_2_filter_micro_forensics.pyが、姉妹ファイルと違ってKLダイバージェンス等をインラインで再実装し、'純粋オーケストレーション'という自己ラベルに反していた。"
    applicability_tier: "per-commit"

  # ---- 2026-08-09 新設(盲点A-2への対応) ----
  A6_neighborhood_sweep_before_concluding:
    status: "NEW (v1.1.0)"
    question: >
      問題を1件発見したとき、そこで探索を打ち切っていないか。
      同一ブロック・同一関数・前後数行に、同種の問題がないかを走査したか。
      とりわけ、**検出に使ったパターン(grep等)に合致しない、同じ性質の問題**を
      明示的に探したか。
    rationale: >
      発見の瞬間は達成感があり、そこで探索を止めたくなる。しかし問題は
      往々にして単独では発生しない。同じ書き手が同じ時に書いた隣接コードには、
      同じ性質の問題が潜んでいる可能性が高い。
    example: >
      ViewportWorkspace.tsx:139 の Math.random() による上書きを発見して報告したが、
      その直前138行の `spectralRadius += 0.03` と直後140行の `freeEnergy *= 1.01` を
      見落とした。3行連続で同じ性質(恣意的な値の捏造)の処理だったにもかかわらず、
      1件しか報告できていなかった。原因は、Math.random という**目立つパターン**に
      反応して探索を終えたこと。前者2件はgrepの禁止パターンに合致しないため、
      機械検出でも捕まらない。
    implication_for_ci: >
      この事例は、anti_fabrication_enforcement_protocol.yaml rule_1 のような
      パターンベースのCI検出が**必要だが十分ではない**ことを示す。
      恣意的な定数演算(+0.03, ×1.01)はgrepで捕捉できない。
      パターン検出は人間のレビューを置き換えず、補助するにとどまる。
    applicability_tier: "per-commit(問題を1件見つけた、まさにその時)"

  # ---- 2026-08-09 新設(盲点A-5への対応) ----
  A7_negative_claim_falsification_check:
    status: "NEW (v1.1.0)"
    question: >
      「〜がない」「〜されていない」「検証なしに〜している」という**否定形の主張**を
      書く前に、それを否定する仕組み — 上流での防御的な変換、暗黙のガード、
      呼び出し前のバリデーション — が存在しないことを確認したか。
    rationale: >
      否定形の主張は、原理的には反証がきわめて容易である(反例が一件あれば崩れる)。
      にもかかわらず、肯定形の主張よりも検証が甘くなりやすい。
      「ある」ことを示すには一箇所を見ればよいが、「ない」ことを示すには
      関連する全経路を見る必要がある、という非対称性を意識していないため。
    example: >
      「00_1_parse_journal.py は Account_Name を検証なしにそのまま書き出す」と報告し、
      CSVインジェクションの脆弱性として深刻度を付けた。しかし実際には3行下で、
      全ての値に `ACC_` プレフィックスを付与する処理があり、当該攻撃は
      構造的に成立しない。読んだのは書き出し箇所だけで、その手前の変換を
      読んでいなかった。(AUDIT_REPORT.md R-1 で取り下げ済み)
    procedural_guidance: >
      否定形の主張をする際は、最低限、対象の値が「入ってくる箇所」から
      「出ていく箇所」までの経路を一度は通しで読むこと。
      片端だけを読んで「〜されていない」と断定しない。
    applicability_tier: "per-commit"

# ------------------------------------------
# カテゴリB: 動的観点(実際に動かして検証)
# ------------------------------------------
category_B_dynamic_verification:
  B1_usage_tracing:
    question: "その関数・契約は、リポジトリ全体を検索して、実際にどこかから呼ばれているか。"
    example: "core_contracts.pyのDbCアサーションが、自身のテストファイル以外から一度も呼ばれていなかった。"
    applicability_tier: "periodic"

    # ---- 2026-08-09 拡張(盲点A-3への対応) ----
    scope_extension_2026_08_09:
      status: "EXTENDED (v1.1.0)"
      additional_question: >
        **その検証機構自体が、実際に起動するか。**
        テストファイルが存在することと、そのテストが実行されることは別問題である。
        同様に、CIの設定が書かれていることと、そのフックが実際に発火することも別問題。
        以下の三段階を、それぞれ別個に確認すること。
          (1) 定義されているか
          (2) 呼ばれているか
          (3) その呼び出しが、実際の実行経路に乗っているか
      example: >
        core_contracts.py のDbC契約について、(1)定義されている・(2)本番コードから
        呼ばれていない、までは検出できた。しかし(3)を確認しなかったため、
        「単体テストで個別には検証されている」と誤って記述した。
        実際には test_core_contracts.py 自体が bin/batch_unittest.sh の
        TEST_MODULES 配列に含まれておらず、一度も実行されていなかった。
        同様に未実行のテストが計13本存在した。(AUDIT_REPORT.md C-3)
      generalization: >
        「安全装置が存在するか」ではなく「安全装置が作動するか」を問うこと。
        TLUで繰り返し現れた失敗パターン — DbCが呼ばれない、テストが実行されない、
        反省ログの対策が実施されない、pre-commitが --no-verify で回避されうる —
        は、すべてこの一点に還元できる。
      mechanical_check: >
        「テストファイルの実在」と「実行対象配列」の差分を、CIで機械的に検証する。
        手作業での同期は必ず再び乖離する。(EXECUTION_PUNCHLIST A18)

  B2_empirical_numeric_sanity_check:
    question: "生成済みの実データを実際に開き、理論上ありえない値が出ていないか確認したか(ソースコードを読むだけでは気づけない)。"
    example: "13サンプル中8サンプルでkl_divergence_drift列が負値を取っていた(当初「7サンプル」と記載したが、2026-08-09のメタ監査による全数走査で8件に訂正。この訂正自体がE1「確度の明示」の必要性を示す実例でもある)。真のKLダイバージェンスはギブスの不等式により非負のはずであり、これはソースコード監査だけでは見つからなかった、実データ確認が必要な発見だった。"
    applicability_tier: "periodic"

  B3_tool_based_objectification:
    question: "主観的な読解ではなく、lint・型チェック・クローン検出ツールで数値化できないか。"
    example: "2026-08-08はネットワーク制約でmypy/pylint/jscpdが実行できず、手作業での代替集計にとどまった。ネットワーク接続可能な環境での再実行を推奨事項として明記した。"
    applicability_tier: "periodic"

# ------------------------------------------
# カテゴリC: 文書とコードの突き合わせ
# ------------------------------------------
category_C_document_code_crosscheck:
  C1_self_report_vs_reality:
    question: "'完了' '修正済み'という記載が、実際のコードの状態と一致しているか。"
    example: "TLU_App4_Development_Progress_Checklist.yamlは75.77%一致率の時点以降も全フェーズをCOMPLETEDと記録し続けていた。TLU_Meta_Learning_Self_Reflection_Log.mdも'概算式の無断捏造'の修正を宣言していたが、実コードには残存していた。"
    applicability_tier: "per-commit(完了マーキング時に必須)"

  C2_spec_vs_implementation:
    question: "SDL(仕様)と実コードが乖離していないか。"
    example: "旧SDL_004が存在しない関数名(solve_discrete_are等)を記載していた。旧SDL_001の温度定義(v基準)と実装(X基準)が食い違っていた。"
    applicability_tier: "periodic"
    caution_2026_08_09: >
      仕様書を先に更新して実装が追いつかない場合も、この基準に抵触する。
      new-TLU-SDLs/ の改訂案を TLU-SDLs/ へ統合する際は、未実装の条項に
      明示的な「未実装」マーカーを付けること。さもなければ、
      「存在しないシステムを記述した仕様書」という、まさにここで指摘した状態を
      自ら作り出すことになる。

  C3_cross_document_consistency:
    question: "複数の文書が同じ対象を記述しているとき、内容(特に数値・結論)が一致しているか。"
    example: "docs/samples/README.mdとsamples/README.mdが、Sample 6・7について正反対の診断(健全 vs 市場操作)を下していた。"
    applicability_tier: "periodic"

    # ---- 2026-08-09 拡張(盲点A-4への対応) ----
    scope_extension_2026_08_09:
      status: "EXTENDED (v1.1.0)"
      additional_question: >
        **文書内の位置参照(セクション番号、見出し番号、節番号)を、
        行番号と同じ厳密さで検証したか。**
      rationale: >
        行番号は grep や sed で機械的に取得するため正確になりやすい。
        一方、セクション番号は「たぶんあの節だろう」という記憶や印象で
        書かれがちで、そこに検証の非対称性が生じる。
      example: >
        「238行目は重複した**4**セクションの内部」と記述したが、実際には
        重複した**3**セクション(3D Micro KL Drift)の内部だった。
        238という行番号自体は正確だったのに、それが属するセクション番号は
        確認していなかった。(AUDIT_REPORT.md R-3)
      procedural_guidance: >
        セクション番号を書くときは、`grep -n '^#'` 等で見出し行の位置を取得し、
        参照する行番号がどの見出しの範囲に入るかを機械的に確認する。

  C4_primary_source_triangulation:
    question: "疑わしい記述は、二次資料(索引・要約)ではなく一次資料(個々のサンプルの生成データ・レポート)まで遡って確認したか。"
    example: "Sample 5のデッドロック時刻(t=12 vs t=51)の矛盾は、Sample_5自身のREADME/clinical_reportまで遡ることで、どちらが正しいか判定できた。"
    applicability_tier: "periodic"
    note_2026_08_09: >
      この基準は、監査レポート自身にも適用される。メタ監査(2026-08-09)は、
      過去のレポートの散文を読み返すのではなく、主張の一つずつを
      src/, bin/, tests/, docs/, samples/ の実物に戻って照合する方式で行った。
      自分の書いた文章を読み返すだけでは、自己申告の再生産にしかならない。

# ------------------------------------------
# カテゴリD: 人間にしか判断できない観点(自動化不可)
# ------------------------------------------
category_D_human_only:
  D1_intent_vs_undocumented_workaround:
    question: "バグに見えるものは、実は意図的な対応だったか。これはコードを読むだけでは判定できず、開発者本人への確認が必須。"
    example: "KLマスキング、LQRのゼロゲインフォールバック、Tikhonov正則化の不整合、温度のX基準採用 — いずれも2026-08-08、蓮風さんへの直接ヒアリングによって初めて『意図的』か『過失』かが判明した。"
    applicability_tier: "immediate(意図的な設計判断をした瞬間に、その場でメモを残す。silent_workaround_prevention_protocol.yaml rule_1参照)"
    non_automatable: true

  D2_epistemic_status_disclosure:
    question: "断定的な表現(証明する、breakthrough等)が、実際の検証段階(Level 0〜3)に見合っているか。"
    example: "samples/README.mdが、未検証のダミーデータに基づく結果を'証明する'と表現していた。SDL_011のepistemic_status_labelingに違反。"
    applicability_tier: "per-commit(対外文書作成時に必須)"

# ------------------------------------------
# カテゴリE(2026-08-09 新設): 報告の規律
# ------------------------------------------
category_E_reporting_discipline:
  status: "NEW CATEGORY (v1.1.0)"
  rationale: >
    v1.0.0は、カテゴリA〜Dのすべてが「問題をどう見つけるか」の基準だった。
    「見つけたものをどう正確に書くか」の基準は一つもなかった。
    2026-08-09のメタ監査が発見した誤りは、その全てが後者に属していた。
    観察そのものではなく、観察の記述に問題が集中していたため、
    独立したカテゴリとして分離する。
  applies_to: >
    監査レポートに限らず、SDL・ルールセット・進捗チェックリスト・
    反省ログ・README など、**事実を主張する全ての文書**に適用する。

  E1_confidence_marking_on_quantitative_claims:
    status: "NEW (v1.1.0) — 盲点A-1への対応"
    question: >
      件数・割合・網羅性に関する記述は、**全数走査によるものか、抜き取りによるものか**。
      その区別が、読み手に伝わる形で明示されているか。
    the_evidence: >
      メタ監査で確認された事実は明快だった。
      **概算で書いた件数は4件中4件が誤っていた。**
        「13サンプル中7件が負値」→ 実際は8件
        「compute_safe_pinv 9箇所」→ 実際は8箇所
        「src/filters/ 41本」→ 実際は42本
        「独自クリッピングを持つ可視化スクリプト13本」→ 実際は16本
      **一方、悉皆調査して書いた件数は全て正確だった。**
        可視化スクリプト36本、src/core/ 14本、App-4レンダラー14本、
        実行中テスト20/16本 — いずれも誤りなし。
      つまり問題は「注意力」ではなく「モードの区別」にある。
      全数走査すれば正確に書けるし、していなければ外れる。
      にもかかわらず両者が同じ断定形で並記されていたため、
      読み手には区別がつかなかった。
    the_rule: >
      対処は「もっと注意深く数える」ではない(それは実行不能な精神論である)。
      **どちらのモードで書いているかを、記号として明示する。**
      AUDIT_REPORT.md で採用した記法を標準とする。
        ★★★ = 悉皆調査済み(対象を全件走査した)
        ★★  = 抜き取り確認(一部を確認し、他も同様と推定した)
        ★   = 未検証・推定(ツール未実行、または手作業集計)
      この記法は、書き手に「いまどちらのモードか」を自問させる効果も持つ。
      ★★ を付けようとした瞬間に「全部見れば ★★★ にできるのでは」と
      気づける設計になっている。
    applicability_tier: "per-commit(数値を含む記述を書く、その都度)"

  E2_declare_what_was_not_examined:
    status: "NEW (v1.1.0)"
    question: >
      その監査・レポート・チェックが**カバーしなかった範囲**を、
      文書内に明示したか。「記載がないこと」が「問題がないこと」と
      読まれない形になっているか。
    rationale: >
      監査レポートの沈黙は、読み手には「確認して問題がなかった」と
      解釈されうる。実際には「見ていない」だけであることが多い。
      この誤読は、監査が信頼されるほど危険度が増す。
    example: >
      AUDIT_REPORT.md §6「監査の限界と未監査領域」がこれにあたる。
      bin/orchestrators/ 29本、bin/visualizers/ 30本が未監査であること、
      mypy/pylint/jscpd がサンドボックスのネットワーク制約で実行できなかったこと、
      TLU-App-3 が軽量チェックのみであることを表として明示した。
    applicability_tier: "レポート・チェック結果を文書化する際に必須"

# ------------------------------------------
# 運用ルール
# ------------------------------------------
operational_integration:
  per_commit_checklist: >
    A1, A2, A3, A5, A6, A7, C1(完了マーキング時), D2(対外文書時), E1(数値を書く時)
    — Gemini自身が各コミット前に自問する軽量チェック。
    v1.1.0で A6・A7・E1 を追加した。いずれも「1件見つけた直後」「否定形を書く直前」
    「数値を書く時」という、具体的な瞬間に紐づく問いであり、
    網羅的な棚卸しを要求するものではないため、per-commitでも負荷は小さい。
  periodic_audit_checklist: >
    A4, B1(拡張された三段階確認を含む), B2, B3, C2, C3(位置参照の検証を含む), C4
    — 機能単位・週次等でまとめて棚卸しする、より重い検証。
    CLAUDE_AUDIT_HANDOFF.mdに定める定期独立監査の主対象。
  continuous_habit: >
    D1 — 意図的な設計判断をした瞬間に、silent_workaround_prevention_protocol.yaml
    rule_1に従い、memo_development_process.mdへ即時記録する習慣。事後に思い出すことはできない。
  on_every_report: >
    E2 — 監査結果・チェック結果を文書化する際は、必ず未監査領域の節を設ける。

# ------------------------------------------
# チェックリスト自体の実績ベース改訂(2026-08-08追記、Promptbreeder 2309.16797に基づく)
# ------------------------------------------
checklist_self_revision_mechanism_2026_08_08:
  origin: >
    "Promptbreeder: Self-Referential Self-Improvement via Prompt Evolution"
    (Google DeepMind, 2309.16797)の二階層自己言及的改善に基づく。タスク自体を
    改善するだけでなく、「タスクを改善するやり方」自体も同じ実績データを使って
    改善する、という構造。本チェックリストは現状、固定的な項目のまま運用される
    想定になっており、この二階層目が欠けている。
  mechanism: >
    new-rulesets/regression_history_ledger_protocol.yaml のtriage_recordが一定数
    蓄積された段階(目安値は要architect判断)で、各チェック項目ごとに、
    実際にgenuine_bug判定へ繋がった発火回数と、発火したが無関係・false positiveだった
    回数を集計する定期棚卸しを行う。
  outcome: >
    一度も発火しなかった項目は、削除ではなく「まだ機会がなかった」のか「もう不要」
    なのかを人間が判断する材料として提示する。false positiveが多い項目は、問いの
    文言や閾値の見直し対象とする。高頻度でgenuine_bugを捕捉した項目は、
    periodicからper-commitへのtier格上げを検討する。
  first_execution_2026_08_09: >
    本v1.1.0改訂が、この機構の初回発動にあたる。ただしjournal.jsonlが未稼働のため、
    triage_recordの代わりにメタ監査の所見を証拠源として用いた。
    その結果として: v1.0.0の既存項目に削除・格下げ対象は見つからず(全項目が
    実際に有効な発見を生んでいた)、追加が5件(A6, A7, E1, E2 + B1・C3の拡張)となった。
    journal.jsonl稼働後は、本来設計した通りの実績データに基づく棚卸しへ移行すること。
  caution: >
    この棚卸し自体もD1と同様、最終判断は人間(アーキテクト)が行う。チェック項目の
    自動追加・自動削除は行わない——Promptbreederのように変異プロンプトの生成・淘汰まで
    LLMに委ねる完全自動ループは、EvoPromptと同じ理由で時期尚早と判断する。

# ------------------------------------------
# Geminiへの査読依頼事項(2026-08-09)
# ------------------------------------------
review_requests_for_gemini:
  framing: >
    以下は、Claudeが自分では判断できない、あるいは判断すべきでない論点である。
    賛成/反対のいずれであっても、判断の根拠を添えて返してほしい。
    不一致は解消せずログすることが、CLAUDE_AUDIT_HANDOFF.md 第5節の趣旨である。

  Q1_per_commit_burden: >
    per-commitの項目が v1.0.0 の6件から v1.1.0 で9件に増えた。
    これは日常の実装作業において、現実的に維持可能な負荷か。
    もし過大なら、どの項目をperiodicへ降ろすべきか。
    Claudeは「監査する側」であって「毎コミットで守る側」ではないため、
    この負荷感については当事者であるGeminiの判断の方が信頼できる。

  Q2_E1_notation_practicality: >
    E1の★記法を、監査レポート以外の日常文書(コミットメッセージ、
    進捗チェックリスト、SDL)にまで適用することは現実的か。
    それとも適用範囲を「対外文書と監査レポートのみ」に限定すべきか。
    過度に適用すると記法がノイズになり、かえって読まれなくなる恐れがある。

  Q3_A6_stopping_rule: >
    A6(近傍走査)には「どこまで走査すれば十分か」の停止規則がない。
    現状は「同一ブロック・同一関数・前後数行」と曖昧に書いている。
    実務的に運用可能な、より明確な境界を提案できるか。

  Q4_measurability: >
    A7(否定形主張の反証確認)とE2(未監査領域の明示)は、
    「やったかどうか」を外部から検証しにくい。
    自己申告に依存する基準は、まさに本監査が繰り返し問題視してきた形式である
    (C1参照)。機械的に検証可能な形へ落とし込む方法はあるか。
    ないとすれば、それはこの基準の限界として明記すべきか。

  Q5_missing_blind_spots: >
    最も重要な問い。**Geminiから見て、Claudeの監査には他にどんな盲点があるか。**
    メタ監査はClaudeによる自己適用であり、自分では見えない死角が
    残っている可能性が高い。特に、Geminiが実装当事者として
    「この指摘は的外れだ」「この観点が抜けている」と感じた箇所があれば、
    それこそが最も価値のある入力になる。

relationship_to_existing_rulesets:
  - "silent_workaround_prevention_protocol.yaml: D1を運用ルールとして具体化したもの。"
  - "new-TLU-SDLs/SDL_011: D2の実証水準ラベリング要件の詳細。"
  - "CLAUDE_AUDIT_HANDOFF.md 第5節(二重盲検プロトコル): カテゴリB・Cのような重い検証を、Gemini自身の日常実装と切り離して行うための構造。本改訂の査読プロセス自体も、この節に従う。"
  - "tlu_development_meta_guidelines.yaml separation_of_concerns: A5の判定基準の一次情報源。"
  - "regression_history_ledger_protocol.yaml: 各項目の発火実績を蓄積し、checklist_self_revision_mechanism の証拠源となる。"
  - "precommit_enforcement_protocol.yaml: B1拡張が要求する『機構が実際に起動するか』の機械的検証を担う。"
