# ==========================================
# regression_history_ledger_protocol.yaml (new-rulesets)
# TLU System: 回帰検証結果の追記式・構造化履歴台帳
# Version: 1.0.0 (New)
# Author: Claude (Cowork, 独立監査ロール) — 2026-08-08
# ==========================================

amendment_meta:
  problem_statement: >
    現状の「回帰テスト」運用は、実行するたびに直前の結果を上書きする一回性の
    pass/fail報告にとどまっている。TLU_Meta_Learning_Self_Reflection_Log.md は
    散文で自己反省を記録する試みだったが、2026-08-08の監査で「概算式の無断捏造」の
    修正宣言が実コードの状態と食い違っていたことが判明した(audit_criteria_checklist.yaml
    C1参照)。これは、記録が構造化されておらず後から機械的に検証できなかったこと、
    かつ記録が「今回どうだったか」の単発報告にとどまり、時系列の推移として
    蓄積・参照される仕組みがなかったことの、両方が原因である。
  origin: >
    蓮風さんの提案(2026-08-08)による。「リポジトリそのものが、わたしたちが取り組む
    問題領域の暫定的な共有定義であり、再帰的に更新されうる」という認識に立ち、
    チェックリストの適用結果そのものを、チェックリストと同格の一次データとして
    時系列蓄積することを目的とする。単なる「全件green」ではなく、green/redの内訳、
    redの発生箇所、そして後日の人間によるトリアージ結果までを、追記のみで記録する。
  design_principle: >
    複式簿記との同型性を明示的に採用する。複式簿記が「現在の残高」だけでなく
    「取引の全履歴」を追記し続けることで事後の再構成を可能にするのと同じく、
    本台帳は「現在のテスト結果」だけでなく「全実行履歴」を追記し続ける。
    既存レコードの書き換え・削除は禁止する(append-only)。誤りの訂正は、
    元のレコードを参照する新しいレコードとして追記する(会計における
    「反対仕訳」に相当)。

# --------------------------------------------------
# 台帳の物理配置とフォーマット
# --------------------------------------------------
ledger_format:
  location: "regression_history/journal.jsonl (リポジトリルート、新設)"
  naming_correction_2026_08_08: >
    当初「ledger(元帳)」と命名していたが、これは不正確である。元帳は勘定科目ごとに
    再整列・集計された派生ビューであり、本ファイルが担うのは時系列に沿った
    一次記録(仕訳日記帳)の役割である。meta_learning_usageのexample_queriesが
    元帳への転記に相当する。この対応関係を明示するため、journal.jsonlに改称する。
  format: "JSON Lines (1行1レコード、追記のみ)。CSVではなくJSONLを採用する理由は、failuresが可変長配列であり、CSVでは正規化にネストしたテーブルが必要になり複雑化するため。"
  rotation: >
    ファイルが肥大化した場合は、年単位で
    regression_history/journal_2026.jsonl のようにローテーションしてよいが、
    過去ファイルへの書き込み(訂正含む)は行わず、訂正は常に最新ファイルへの
    追記とする。

# --------------------------------------------------
# レコード・スキーマ
# --------------------------------------------------
record_schema:
  run_record:
    description: "1回のテスト・監査実行の結果を記録するレコード種別。"
    fields:
      - name: "record_type"
        value: "\"run\"固定"
      - name: "run_id"
        type: "string (UUID推奨)"
        description: "このレコード自身を一意に指す。後続のtriageレコードから参照される。"
      - name: "timestamp"
        type: "ISO8601"
      - name: "commit_hash"
        type: "string"
        description: "git rev-parse HEAD。どのコード状態に対する実行かを固定する。"
      - name: "tool"
        type: "string (enum推奨だが将来の拡張のため自由記述も許可)"
        examples: ["pytest", "vitest", "pre_commit_hooks", "ci_workflow", "audit_criteria_checklist_self_check(Gemini自己適用)", "claude_periodic_audit(二重盲検独立監査)"]
      - name: "scope"
        type: "string"
        description: "対象範囲。例: 'src/core/', 'TLU-App-4/src/viewport/'"
      - name: "counts"
        type: "object"
        fields: ["green (int)", "red (int)", "skipped (int, optional)"]
      - name: "failures"
        type: "array of objects"
        fields:
          - "test_id (string): テストケース名、またはaudit_criteria_checklistの項目ID(例: 'A1', 'D1')"
          - "file (string): file:line形式を推奨"
          - "line (int, optional)"
          - "message (string): 失敗内容の要約"
        note: "green件のみだった場合は空配列。空配列であっても'red: 0'と明示することが目的であり、レコード自体を省略してはならない。"
      - name: "artifact_link"
        type: "string (optional)"
        description: >
          この申告を裏付ける一次証拠(実際のCIログ、stdout原文のファイルパスまたはハッシュ)
          へのリンク。会計監査における「立証(vouching)」に相当する。追記専用であることは
          「後から書き換えられない」ことしか保証せず、「書かれた瞬間に真実だった」ことは
          保証しないため、run_record自身が検証可能であるためにこのフィールドを設ける。
          省略可能だが、tool: "claude_periodic_audit"のレコードでは必須とする。

  triage_record:
    description: >
      run_recordの特定のfailureに対し、後日(多くは人間、または蓮風さんへのヒアリングを経て)
      「バグか、意図的な対応か」を判定した結果を追記するレコード種別。
      audit_criteria_checklist.yaml の D1(意図か過失かは自動化不可、人間確認が必須)に
      直接対応する。run_recordを書き換えるのではなく、常に新規レコードとして追記する。
    fields:
      - name: "record_type"
        value: "\"triage\"固定"
      - name: "timestamp"
        type: "ISO8601"
      - name: "refers_to_run_id"
        type: "string"
        description: "対象のrun_record.run_id"
      - name: "refers_to_test_id"
        type: "string"
        description: "対象のfailures[].test_id"
      - name: "classification"
        type: "string (enum)"
        values: ["genuine_bug", "intentional_workaround_undocumented", "intentional_workaround_now_documented", "flaky", "environment_issue", "duplicate_of_other_finding"]
      - name: "note"
        type: "string"
        example: "2026-08-08のLQRフォールバックのヒアリング結果と同種。今回はNaN入力によるものと確認。"
      - name: "triaged_by"
        type: "string"
        example: "蓮風 / Claude(periodic audit) / Gemini"

# --------------------------------------------------
# 統合ポイント
# --------------------------------------------------
integration_points:
  with_precommit_enforcement_protocol: >
    precommit_enforcement_protocol.yaml のphase_1〜3で有効化される各フック
    (ruff, mypy, bandit, vitest等)の実行結果を、コミット前フックの最終ステップとして
    run_recordとして1行追記する。フックが失敗してコミットがブロックされた場合も、
    「redだった」という事実自体は記録に値するため、追記は失敗時にも必ず行う。
  with_anti_fabrication_enforcement_protocol: >
    TLU-App-4のrule_1(CIパターン禁止)・rule_2(vitest必須化)の実行結果も
    同一台帳にtool: "vitest"またはtool: "ci_workflow"として統合する。
    Python本体とApp-4を同じ台帳に記録することで、両者を横断した推移比較が可能になる。
  with_claude_audit_handoff: >
    CLAUDE_AUDIT_HANDOFF.md 第5節の二重盲検独立監査についても、
    tool: "claude_periodic_audit"として同一台帳に記録する。これにより、
    日常的な機械チェック(pytest等)と、周期的な独立監査の所見の両方が
    同じ時系列上で参照できるようになり、「機械チェックはgreenだったが独立監査ではredだった」
    というパターン(まさにKLマスキングのように、テストが存在しなかったために
    機械チェックでは検出不能だったケース)を後から可視化できる。

# --------------------------------------------------
# メタ学習的活用(蓮風さんの提案の核心)
# --------------------------------------------------
meta_learning_usage:
  rationale: >
    単発のpass/fail報告では、「特定のファイル・特定の機能領域が、時間を通じて
    繰り返しredになっている」という構造的パターンが見えない。JSONLとして
    蓄積することで、jqやpandasのような汎用ツールで、以下のような問いに
    後から答えられるようになる。
  example_queries:
    - "過去6ヶ月でredになった回数が最も多いfile:lineはどこか(慢性的に脆い箇所の特定)。"
    - "genuine_bugとintentional_workaroundの比率は、時間とともにどう変化しているか(設計判断の質の推移)。"
    - "claude_periodic_auditでのみ検出されpytestでは検出されなかった項目はどれだけあるか(機械チェックのカバレッジの穴の定量化)。"
    - "あるSDL改訂(例: SDL_002 v11.0.0)の前後で、関連scopeのred件数はどう変化したか(改訂の効果測定)。"
  note: >
    これらのクエリ自体を自動化するダッシュボード等は、台帳に十分なレコードが
    蓄積されてから(実データが無い段階で可視化基盤だけ作ることは
    priority_rebalancing.yamlの「検証されていないものに過剰投資しない」原則に反する)、
    改めて検討する。まずは台帳への追記自体を配線することを優先する。

# --------------------------------------------------
# トリガー時の履歴自動注入(2026-08-08追記、OPRO 2309.03409に基づく提案)
# --------------------------------------------------
trajectory_replay_mechanism:
  origin: >
    "Large Language Models as Optimizers"(OPRO, Google DeepMind, 2309.03409)の知見に基づく。
    OPROは過去の(試行,スコア)履歴をまるごとプロンプトに埋め込み、LLM自身にそのパターンから
    次の一手を考えさせる。journal.jsonlは現状、後から人間・Claudeが能動的にクエリして読む
    受動的記録に留まっており、「過去に同じ箇所で何を試して何が起きたか」を思い出す責任が
    人間側にある。
  mechanism: >
    Geminiが特定のfile/scopeの修正に着手する前に、journal.jsonlから該当file/scopeに一致する
    run_record・triage_recordを抽出し、着手前のコンテキストとして自動的に提示する
    「replay」ステップを設ける。簡易スクリプト(例: journal_replay.py <file_or_scope>)で
    該当エントリを時系列に整形出力し、CLAUDE_AUDIT_HANDOFF.mdまたは開発ガイドに、
    Tier B/C着手前の実行手順として追加する。
  caution: >
    OPROは「LLM自身が履歴を読んで次の一手を自動決定する」閉じたループだが、TLUでは
    人間(Gemini操作者)が履歴を読んで判断する、一段人間を介在させた運用にとどめる。
    全自動化(replay結果をそのままLLMの意思決定に直結させる)は、EvoPromptと同じ理由
    (fitness指標がまだ信頼できるほど成熟していない)で時期尚早と判断する。

# --------------------------------------------------
# 既存インフラへの接続(2026-08-08、実地調査に基づく)
# --------------------------------------------------
grounding_in_existing_infrastructure_2026_08_08:
  context: >
    本プロトコルは設計時点では抽象的な提案だったが、実際に既存の回帰テスト・バッチ処理の
    仕組みを調査した結果、journal.jsonlを繋ぎ込むべき具体的な接続点がすでに存在することが
    判明した。以下はゼロから作るのではなく、既存スクリプトの出力先を変えるだけで実現できる。
  findings:
    - id: "F1"
      target: "bin/batch_unittest.sh"
      description: >
        実際の回帰テストランナー。ユニットテスト20本・インテグレーションテスト16本を
        python -m unittest でTEST_MODULES配列に沿って逐次実行する。set -euo pipefail
        により最初の失敗で即停止するため、全体のうち何本がgreen/redだったかという
        構造化された内訳は、現状どこにも残らない。
    - id: "F2"
      target: "bin/batch_processing.sh"
      description: >
        サンプル1件のフィルタ・パイプライン実行。同様にset -eで即停止し、
        標準出力(所要秒数のみ)しか残らない。
    - id: "F3"
      target: "scratch/run_batch_analysis_python.py, scratch/run_batch_analysis_0X_to_4X.sh"
      description: >
        複数サンプル連続処理の唯一の実装だが、bin/ではなくscratch/に存在する。
        1件失敗しても後続を継続する設計はbin/側より優れているが、対象がERP系
        Sample_0X〜4Xの5件にハードコードされており、現行のsamples/配下の全サンプルを
        網羅していない。
    - id: "F4"
      target: "scratch/error.log, scratch/calc_time.log, scratch/viz_time.log"
      description: >
        既に存在する手動作成ログ。標準出力(絵文字付き)をそのままリダイレクトしたもので、
        書き込み元のスクリプトはリポジトリ内に存在しない(その場しのぎの手動操作と推定)。
        error.logという名前にもかかわらず、実際にはエラーが1件も含まれておらず、
        名前が主張する意味と実体が食い違っている(A3の実例が、回帰テストの記録自体に
        既に存在していたことになる)。
    - id: "F5"
      target: "TLU-App-4/TLU-App-SDLs/SDL_009_Telemetry_Profiling_HUD_and_QA_Compliance.yaml (既存・new-系ではない)"
      description: >
        qa_compliance.2_regression_testingが、bin/batch_unittest.shを指して
        「既存の34のユニットテストおよび17のインテグレーションテストを無傷全パス」と
        明記しているが、実際のTEST_MODULES配列を数えるとユニット20本・インテグレーション
        16本であり、数値が一致しない。C1(自己申告と実態の突き合わせ)の新規実例。
  integration_steps:
    - step: 1
      action: >
        bin/batch_unittest.shを、set -eによる即停止方式から、各モジュールの成否を
        個別に捕捉して最後まで走らせる方式に変更し、末尾でgit rev-parse HEADと
        各モジュールの成否をrun_record(tool: "batch_unittest")としてjournal.jsonlに追記する。
    - step: 2
      action: >
        bin/batch_processing.shも同様に、各ステップの失敗を継続しつつ記録し、
        tool: "batch_processing_pipeline"、scope: 対象サンプル名としてrun_recordを追記する。
    - step: 3
      action: >
        scratch/の2本の複数サンプル連続処理スクリプトをbin/へ昇格させ、対象を
        ERP5サンプルのハードコードからsamples/Sample_*の動的列挙に一般化した上で、
        journal.jsonlへの追記を組み込む。
    - step: 4
      action: >
        journal.jsonlの運用が開始された時点で、scratch/error.log等の手動ログは退役させる。
    - step: 5
      action: >
        SDL_009の「34/17」という固定数値を、正しい実数(20/16)に修正するか、
        あるいは固定数値を書かずrun_record.countsを正とする記述に改める。
  punchlist_reference: "EXECUTION_PUNCHLIST.md Tier A に対応項目を追加(A14〜A17)。"

verification: >
  次回監査で、regression_history/journal.jsonl が実在し、直近のコミット・CI実行に
  対応するrun_recordが実際に追記され続けているかを確認する。「台帳の仕組みを設計した」
  ことと「台帳に実際に記録され続けている」ことは別問題であり、これも
  audit_criteria_checklist.yaml C1(自己申告と実態の突き合わせ)の対象とする。
  過去の教訓(anti_fabrication_enforcement_protocol.yaml verification節と同様)に倣い、
  「記録する設計にした」ことは遵守の証拠として認めない。

open_questions_for_architect:
  - "audit_criteria_checklist.yamlのper-commit項目(A1,A2,A3,A5,C1,D2)を、Gemini自身が
     日常的にrun_recordとして記録する運用は、心理的負荷が高すぎないか。段階的導入
     (まずはpytest/vitestの自動記録のみ→慣れたらチェックリスト自己適用も追記)が
     妥当か。"
  - "triage_recordの記入者(蓮風/Claude/Gemini)を、将来的に誰がどの頻度で行うのが
     持続可能か。二重盲検監査の頻度(CLAUDE_AUDIT_HANDOFF.md)と連動させるべきか。"
