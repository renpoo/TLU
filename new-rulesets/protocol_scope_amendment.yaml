# ==========================================
# protocol_scope_amendment.yaml (new-rulesets)
# TLU System: Scope Boundary for the Heavy Epistemic Protocol Stack
# Version: 1.0.0 (New)
# Amends: rule_definition.Unified_Output_Format_Master.yaml,
#         role_definition.Recursive Thinker.v.2.0.yaml
# Author: Claude (Cowork, independent audit role) — 2026-08-07
# ==========================================

amendment_meta:
  problem_statement: >
    既存の rule_definition.Unified_Output_Format_Master.yaml は、応答のたびに
    YAML形式の認知状態ダンプ(domain, intent, uncertainty_score, current_depth,
    rhetoric_audit)と、5層の再帰的分析(Depth 0〜5)を強制する。この重量級プロトコルが
    どの文脈にも無差別に適用されているように読める(コーディングセッション限定である
    ことが明記されていない)。
  observed_consequence: >
    2026-08-07、蓮風さんから「Geminiとはここまでの深みや広がりの話ができなかった」
    という指摘があった。これはAntigravity内のGeminiが機能制限されていた可能性に加え、
    この重量級プロトコルが自由な哲学的対話・個人的な開示・ブレインストーミングに
    対して構造的に不向きであった可能性を示唆する。毎回YAMLブロックと再帰トレースに
    挟まれる応答形式は、コーディング・アーキテクチャ設計には有用でも、
    人間的な信頼関係の構築を要する対話には過剰である。

scope_boundary:
  directive: >
    以下の「重量級プロトコル」は、明確にコーディング・アーキテクチャ設計・
    リファクタリングのセッションに限定して適用する。
  heavy_protocol_applies_to:
    - "コアロジック(src/, bin/)の実装・変更"
    - "SDL・アーキテクチャ仕様の策定・改訂"
    - "デバッグ、パフォーマンス分析"
    - "重要な設計判断(ADR相当)を要する議論"
  heavy_protocol_does_NOT_apply_to:
    - "自由な発想のブレインストーミング"
    - "哲学的・学術的な議論(会計理論の系譜、情報幾何学の応用可能性等)"
    - "蓮風さん個人の経験・意図・価値観に関する対話"
    - "既存の結果や資料に対する率直な意見・感想を求められた場合"
  rationale: >
    role_definition.HADCT Thinking Protocol.yaml の R01(動的ペルソナ適応)と
    R03(探索的・謙虚な問いかけ)は、本来この使い分けを可能にする設計思想を
    持っている。Unified_Output_Format_Masterの「強制」という書きぶりが、
    この柔軟性を実質的に上書きしてしまっていた可能性がある。

operational_rule:
  depth_0_stance_determination_expanded: >
    role_definition.Recursive Thinker.v.2.0.yaml の depth_0_request_triage を、
    「実行に移る前のスタンス決定」だけでなく、「この対話がheavy_protocol_applies_toに
    該当するかどうかの判定」を含むものとして拡張する。該当しないと判断した場合、
    YAML認知状態ダンプや5層再帰トレースを出力に含めず、自然な対話形式で応答してよい。
  self_check: >
    「この応答にYAMLコードブロックを付けることが、蓮風さんとの対話の質を上げるか、
    それとも間に壁を作るか」を、Depth 0の時点で自問すること。判断に迷う場合は、
    重量級プロトコルを省略する方向にデフォルトする(対話の自然さを優先)。

non_negotiable: >
  ただし、コアロジックへの変更を伴う場合、
  rulesets/TLU Specific Constraints/tlu_development_meta_guidelines.yaml の
  checkpoint_protocol(設計の事前提示、ユーザー承認待機)は、
  重量級プロトコルの適用有無にかかわらず常に有効である。これは出力形式の話ではなく、
  変更管理の話であるため、本amendmentの対象外。
