# ==========================================
# silent_workaround_prevention_protocol.yaml (new-rulesets)
# TLU System: Preventing Undocumented Ad-Hoc Accommodations
# Version: 1.0.0 (New)
# Author: Claude (Cowork, independent audit role) — 2026-08-08
# Amends: tlu_development_meta_guidelines.yaml (checkpoint_protocol の補強),
#         memo_development_process.md (記録すべき対象の明確化)
# ==========================================

amendment_meta:
  problem_statement: >
    2026-08-07の監査で複数の「バグらしきもの」を指摘したが、2026-08-08の
    蓮風さんとのヒアリングにより、そのうち複数件が実際には意図的な、しかし
    記録されなかった場当たり対応(付け焼き刃対応)だったことが判明した。
    具体例は以下の4件:
    (1) compute_kl_divergenceのsupport mismatchマスキング
        — 3D可視化がinfを描画できないことへの対応。
    (2) solve_lqr_gainのゼロゲイン・サイレントフォールバック
        — 入力データのNaN/欠損混入への対応。
    (3) core_contracts.pyのDbC関数群が未配線
        — リファクタリング依頼時に導入されたが、配線・レビューの両方で見落とされた。
    (4) core_safe_linalgのTikhonov正則化λの不整合
        — 単純な過失(場当たり対応)。
    このうち(1)は memo_development_process.md にすら記録されず、蓮風さん個人の
    記憶にのみ存在していた。第三者監査(Claude)は、コードを読むだけではこの種の
    「意図はあるが記録されない」対応を、純粋なバグと区別できない。これは監査の
    限界であると同時に、TLU開発プロセス自体の構造的な脆弱性でもある。

root_cause_analysis:
  common_pattern: >
    上記4件はいずれも、「その場で発生した具体的な問題(3D描画のクラッシュ、
    NaN入力によるソルバー失敗、レビュー漏れ、正則化の不整合)」に対して、
    「問題の発生源(入力境界、仕様設計)」ではなく「問題が症状として現れた場所
    (可視化スクリプト、ソルバー内部、個別モジュール)」で、その場しのぎの対処が
    行われた、という共通構造を持つ。これは開発速度を優先する上では自然な判断だが、
    (a) 対処の理由が記録されないと、後から見た第三者(あるいは半年後の自分自身)には
    バグとしか見えない、(b) 症状の発生箇所での対処は、しばしば根本原因(入力検証の
    欠如、設計の不整合)を隠蔽してしまい、同種の問題の再発を防げない、という
    二重のコストを生む。

rule_1_mandatory_workaround_log:
  directive: >
    コードが仕様の文字通りの実装から意図的に逸脱する場合(例外の握りつぶし、
    値のマスキング・クリッピング、閾値のハードコード、フォールバック処理)は、
    実装と同時に、以下を含む記録を残すことを必須とする。
  format:
    location: "memo_development_process.md への追記(既存の粘性爆発事故の記録形式を踏襲)"
    required_fields:
      - "発生日"
      - "症状(何が起きたか)"
      - "検討した代替案(他にどんな対処がありえたか)"
      - "選んだ理由(なぜこの対処を選んだか)"
      - "撤回条件(何が満たされればこの対処が不要になるか)"
  rationale: "KLマスキングがmemo_development_process.mdに記録されていれば、今回の監査は初回から正確な診断ができていた。"

rule_2_no_silent_fallback:
  directive: >
    core_*.py 内の例外処理・フォールバック・マスキング・クリッピングは、
    以下のいずれかを必ず伴わなければならない。
  requirements:
    - "logging.warning以上のレベルでのログ出力(最低限の可観測性)"
    - "呼び出し側に伝播する機械可読フラグ(例: solver_failed, novel_route_flag ── SDL_002が導入したパターンをデフォルトの語彙とする)"
    - "「異常なし」に見える値(0、NaN握りつぶし後の平常値等)を、対処の結果として返さないこと(display_safe_representation_principle, SDL_002参照、と同一の精神)"

rule_3_input_validation_at_boundary:
  directive: >
    入力データの汚れ(NaN、ブランク、型不整合)への防御は、症状が現れる計算の
    深部(例: LQRソルバー内部)ではなく、パイプラインの入口(データ取り込み直後)で
    行う。SDL_04の5_dbc_math_invariants_AMENDEDが要求するDbC事前条件を、
    この目的のための正式な機構として位置づける。
  rationale: "SDL_004のroot_cause_identified_2026_08_08で分析した通り、症状と原因が離れた場所にあると、両者の混同(「介入不要」と「ソルバー失敗」の区別不能)が発生する。"

rule_4_ci_dead_code_gate:
  directive: >
    「書かれたが配線されていないコード」(3-1のDbC契約のケース)を、人間の
    レビューだけに頼らず機械的に検出する。
  tooling:
    - "vulture: 未使用の関数・クラス・変数の静的検出。"
    - "pyan3 または code2flow: 呼び出しグラフの可視化。特にcore_contracts.pyの各assert関数が、テストファイル以外から呼ばれているかを確認する。"
    - "coverage.py: samples/配下の実データによるフルパイプライン実行時のカバレッジを計測し、本番経路から一度も実行されない関数を継続的に検知する。"
  ci_integration: "上記をpre-mergeのCIチェックとして組み込み、新規に追加された関数が一定期間(例: 1リリースサイクル)内に本番経路から呼ばれない場合、警告を出す。"

rule_5_refactor_review_checklist:
  directive: >
    Geminiにデザインパターン・メタプログラミング・テンプレート的手法を用いた
    リファクタリングを依頼する際、レビュー(蓮風さんによる承認、
    tlu_development_meta_guidelines.yamlのcheckpoint_protocol)には、
    以下の項目を明示的なチェックリストとして含める。
  checklist:
    - "新たに導入された抽象化(クラス、契約、ユーティリティ関数)は、実際に本番のパイプラインから呼ばれているか。"
    - "呼ばれていない場合、それは意図的な『将来のための足場』か、それとも配線漏れか。前者であれば、その旨をmemo_development_process.mdまたは該当SDLのopen_questions_for_architectに明記する。"
  rationale: "3-1のDbC未配線は、この一行のチェックがあれば検出できていた、単純だが致命的な見落としだった。"

review_trigger: >
  次回、監査(Claudeによるものを含む)で「バグらしきもの」が新たに見つかった場合、
  まずGeminiまたは蓮風さんに「これは意図的な対応だったか」を確認するステップを、
  診断確定の前に必須の手順として挿入する。今回の4件がいずれも、この確認だけで
  診断の精度が大きく変わったことを踏まえる。
